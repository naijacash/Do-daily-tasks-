<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaijaCash Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f5;
            color: #222;
        }

        .header {
            background: #008f4c;
            color: white;
            padding: 20px;
            border-radius: 0 0 20px 20px;
        }

        .header h2 {
            margin-bottom: 8px;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }

        .balance {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .balance p {
            color: #777;
        }

        .balance h1 {
            color: #008f4c;
            margin-top: 8px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 12px;
            color: white;
            background: #008f4c;
            font-size: 16px;
            cursor: pointer;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .referral {
            background: #e9fff3;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            word-break: break-all;
        }

        .logout {
            background: #d62828;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>NaijaCash</h2>
        <p id="welcomeText">Welcome!</p>
    </div>

    <div class="container">

        <div class="balance">
            <p>Available Balance</p>
            <h1>₦<span id="balance">0</span></h1>
        </div>

        <div class="buttons">
            <button class="btn" onclick="deposit()">Deposit</button>
            <button class="btn" onclick="withdraw()">Withdraw</button>
        </div>

        <div class="card">
            <h3>🎯 Tasks</h3>
            <p>Complete available tasks and earn rewards.</p>
        </div>

        <div class="card">
            <h3>👥 Referral</h3>
            <p>Invite friends and earn referral rewards.</p>

            <div class="referral">
                Your Referral Code:
                <strong id="referralCode">Loading...</strong>
            </div>
        </div>

        <div class="card">
            <h3>📢 NaijaCash Updates</h3>
            <p>Stay connected for the latest announcements and updates.</p>
        </div>

        <button class="btn logout" onclick="logout()">Logout</button>

    </div>

    <script>
        // Get the registered user's name
        const userName = localStorage.getItem("naijacashName");

        // If no user is registered, return to login
        if (!userName) {
            window.location.href = "login.html";
        } else {
            document.getElementById("welcomeText").textContent =
                "Welcome, " + userName + " 👋";
        }

        // Referral code
        let referralCode = localStorage.getItem("naijacashReferral");

        if (!referralCode) {
            referralCode = "NC" + Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem("naijacashReferral", referralCode);
        }

        document.getElementById("referralCode").textContent = referralCode;

        function deposit() {
            alert("Deposit section coming soon.");
        }

        function withdraw() {
            alert("Withdrawal section coming soon.");
        }

        function logout() {
            localStorage.removeItem("naijacashName");
            window.location.href = "login.html";
        }
    </script>

</body>
</html>

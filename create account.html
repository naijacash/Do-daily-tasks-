<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - NaijaCash</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-green: #0A5C36;
            --dark-green: #064E3B;
            --gold: #D4AF37;
            --light-gold: #FDF8E2;
            --dark: #111827;
            --light-bg: #F9FBF8;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark);
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background-image: radial-gradient(rgba(10, 92, 54, 0.12) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Header / Logo */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-green);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo span {
            color: var(--gold);
        }

        /* Registration Card Box */
        .signup-card {
            background: linear-gradient(145deg, #075230, #043821);
            border-radius: 20px;
            padding: 2.5rem 1.5rem;
            color: var(--white);
            box-shadow: 0 15px 35px rgba(10, 92, 54, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .signup-card h2 {
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
            text-align: center;
        }

        .signup-subtitle {
            font-size: 0.9rem;
            color: #D1D5DB;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #E5E7EB;
            margin-bottom: 0.4rem;
        }

        .input-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 0.8rem 1rem;
            border-radius: 12px;
            color: var(--white);
            font-size: 1rem;
            outline: none;
        }

        .input-box::placeholder {
            color: #9CA3AF;
        }

        .input-box:focus {
            border-color: var(--gold);
        }

        .terms-box {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            font-size: 0.8rem;
            color: #D1D5DB;
            margin-bottom: 1.5rem;
        }

        .terms-box input {
            accent-color: var(--gold);
            margin-top: 0.2rem;
        }

        .terms-box a {
            color: var(--gold);
            text-decoration: none;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--gold), #B8860B);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 0.9rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s;
            text-align: center;
            display: block;
            text-decoration: none;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
        }

        .login-prompt {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 1.5rem;
            color: #6B7280;
        }

        .login-prompt a {
            color: var(--primary-green);
            font-weight: 600;
            text-decoration: none;
        }

        .login-prompt a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header Logo -->
        <header>
            <a href="index.html" class="logo">Naija<span>Cash</span></a>
        </header>

        <!-- Registration Card Box -->
        <div class="signup-card">
            <h2>Get Started</h2>
            <div class="signup-subtitle">Create your NaijaCash account</div>

            <form action="dashboard.html" method="GET">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="input-box" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="input-box" placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" class="input-box" placeholder="Enter your phone number" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="input-box" placeholder="Create a password" required>
                </div>

                <div class="terms-box">
                    <input type="checkbox" required>
                    <div>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></div>
                </div>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>
        </div>

        <div class="login-prompt">
            Already have an account? <a href="login.html">Sign In</a>
        </div>

    </div>

</body>
</html>
